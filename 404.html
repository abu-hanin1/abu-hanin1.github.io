<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>جاري التحويل</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0f12; color: #f6f8fa; font: 700 18px/1.6 'Segoe UI', Tahoma, sans-serif; text-align: center; }
  a { color: #10e08a; }
</style>
<script>
  // GitHub Pages serves this page for unknown paths, which is what makes short links work:
  // /my-link opens the post page for my-link.
  (function () {
    var m = location.pathname.match(/^\/([a-z0-9][a-z0-9-]{1,60})\/?$/i);
    if (!m) return;
    var go = function () {
      location.replace('/link.html?s=' + encodeURIComponent(m[1].toLowerCase()) + location.search.replace(/^\?/, '&'));
    };
    // Inside Messenger or Facebook on Android, Chrome is tried first, before anything loads.
    // Same list as assets/js/inapp.js. If the jump doesn't happen, the page opens here as usual.
    var ua = navigator.userAgent;
    var inApp = /FBAN|FBAV|FB_IAB|FBIOS|FB4A|FBLITE|Orca|Messenger|Instagram/i.test(ua) && /android/i.test(ua) && !/[?&]nochrome=/.test(location.search);
    var tried = true;
    try {
      tried = !!sessionStorage.getItem('miftah_tried_chrome');
      if (inApp) sessionStorage.setItem('miftah_tried_chrome', '1');
    } catch (e) {}
    if (!inApp || tried) return go();
    var fallback = location.href + (location.search ? '&' : '?') + 'nochrome=1';
    location.href = 'intent://' + location.host + location.pathname + location.search +
      '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
    setTimeout(go, 1200);
  })();
</script>
</head>
<body>
<p>الصفحة غير موجودة.<br><a href="/">الصفحة الرئيسية</a></p>
</body>
</html>
